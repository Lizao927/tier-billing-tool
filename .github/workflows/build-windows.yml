
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build standalone EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "多等级阶梯计费工具" --collect-all openpyxl "多等级阶梯计费工具.py"

      - name: Create quick-start guide
        shell: pwsh
        run: |
          "双击多等级阶梯计费工具.exe即可使用，无需安装Python。" | Set-Content -Encoding UTF8 dist\使用说明.txt

      - name: Package portable application
        run: |
          Compress-Archive -Path "dist\多等级阶梯计费工具.exe","dist\使用说明.txt" -DestinationPath "多等级阶梯计费工具-Windows-x64.zip" -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: 多等级阶梯计费工具-Windows-x64
          path: 多等级阶梯计费工具-Windows-x64.zip
          retention-days: 30
